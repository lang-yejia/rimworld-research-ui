name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore and build
        run: dotnet build Source/ResearchReframed/ResearchReframed.csproj -c Release
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Research-Reframed
          path: |
            About
            1.6
            Languages
            LoadFolders.xml
            LICENSE
            README.md
